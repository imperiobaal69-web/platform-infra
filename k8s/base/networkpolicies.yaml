# Default deny in both directions, then one allow rule per real flow. The
# paths to Postgres and Redis depend on where they run (in-cluster
# StatefulSets locally, private IPs on GCP), so each overlay adds those egress
# rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    # kube-dns, and node-local-dns when NodeLocal DNSCache is on (the GKE
    # cluster enables it): there pods' queries to the kube-dns Service IP are
    # answered by the node-local-dns pods, so allowing only kube-dns times out
    # every lookup. Found on the first deploy to GKE.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchExpressions:
              - {key: k8s-app, operator: In, values: [kube-dns, node-local-dns]}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# Clients of the API: the load generator namespace and Prometheus (scrapes
# and the blackbox availability probe).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
spec:
  podSelector:
    matchLabels: {app: api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: loadtest}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-ingress-from-monitoring
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [worker, postgres-exporter]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {protocol: TCP, port: 9090}
        - {protocol: TCP, port: 9187}
