# One service account per component so that, on GKE, each can be bound to its
# own Google service account (Workload Identity) with only the roles it needs.
# None of them talks to the Kubernetes API, so no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-exporter
automountServiceAccountToken: false
