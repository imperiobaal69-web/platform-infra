apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: {app: worker}
spec:
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  selector:
    matchLabels: {app: worker}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 25%, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: worker}
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: false
      # On SIGTERM the worker stops fetching and drains in-flight jobs for
      # SHUTDOWN_GRACE (25s); anything left is reclaimed by other pods after
      # VISIBILITY_TIMEOUT. The grace period must exceed SHUTDOWN_GRACE.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: audio-jobs
          command: ["/usr/local/bin/worker"]
          ports:
            - {name: metrics, containerPort: 9090}
          env:
            - {name: METRICS_ADDR, value: ":9090"}
            # Each pod is its own Redis Streams consumer; pending deliveries
            # of a dead pod are reclaimed by the others.
            - name: CONSUMER_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: GOMEMLIMIT
              valueFrom: {resourceFieldRef: {resource: limits.memory}}
          envFrom:
            - configMapRef: {name: audio-jobs}
            - secretRef: {name: audio-jobs-db}
          startupProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 2
            failureThreshold: 30
          # The worker has no Service; readiness only gates rollouts and PDB
          # accounting.
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            # The streaming analyzer runs in constant memory (about 136 KB per
            # job); the limit leaves room for the Go runtime and buffers.
            requests: {cpu: "1", memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: blobs, mountPath: /data/blobs, readOnly: true}
      volumes:
        - name: blobs
          persistentVolumeClaim: {claimName: blobs, readOnly: true}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
spec:
  maxUnavailable: 25%
  selector:
    matchLabels: {app: worker}
---
# CPU utilisation is the signal that works without extra components. Queue
# lag is the better one for a job system; KEDA's redis-streams scaler is the
# drop-in replacement (see docs/scaling.md).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: worker}
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - {type: Percent, value: 100, periodSeconds: 15}
    scaleDown:
      stabilizationWindowSeconds: 300
