# Egress on GKE replaces the local overlay's in-cluster datastore rules.
# Dataplane V2 enforces these policies.
#
# - Cloud SQL: the proxy connects to the instance's private IP on 3307, inside
#   the private services access range (terraform output private_services_cidr).
# - Memorystore: same range, 6379.
# - The proxy also calls the Cloud SQL Admin API (ephemeral certificates) and
#   the GKE metadata server (Workload Identity tokens). Google APIs are reached
#   over Private Google Access, whose addresses are not fixed, so 443 is open
#   to any destination for the pods that run the proxy. NAT is the only path
#   out of the private nodes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-cloudsql
  namespace: audio-jobs
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [api, worker, migrate, postgres-exporter]}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 10.100.0.0/16}
      ports:
        - {protocol: TCP, port: 3307}
    - to:
        - ipBlock: {cidr: 169.254.169.252/32}
      ports:
        - {protocol: TCP, port: 988}
    - to:
        - ipBlock: {cidr: 169.254.169.254/32}
      ports:
        - {protocol: TCP, port: 80}
    - ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-memorystore
  namespace: audio-jobs
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [api, worker]}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 10.100.0.0/16}
      ports:
        - {protocol: TCP, port: 6379}
