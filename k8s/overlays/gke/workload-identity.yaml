# Bind each Kubernetes service account to its Google service account
# (terraform output workload_identity_service_accounts). api, worker and
# migrate share the application identity; the exporter has its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: audio-jobs
  annotations:
    iam.gke.io/gcp-service-account: audio-jobs-app@my-gcp-project.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: audio-jobs
  annotations:
    iam.gke.io/gcp-service-account: audio-jobs-app@my-gcp-project.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate
  namespace: audio-jobs
  annotations:
    iam.gke.io/gcp-service-account: audio-jobs-app@my-gcp-project.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-exporter
  namespace: audio-jobs
  annotations:
    iam.gke.io/gcp-service-account: audio-jobs-exporter@my-gcp-project.iam.gserviceaccount.com
