# Cloud SQL Auth Proxy as a native sidecar (an init container with
# restartPolicy Always): it starts, and passes its startup probe, before the
# application container, and it stops after it. Applied to the api, worker
# and postgres-exporter Deployments and to the migration Job.
- op: add
  path: /spec/template/spec/initContainers
  value:
    - name: cloud-sql-proxy
      restartPolicy: Always
      image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
      args:
        - --private-ip
        - --auto-iam-authn
        - --structured-logs
        - --port=5432
        - --health-check
        - --http-address=0.0.0.0
        - --http-port=9801
        # After SIGTERM, keep serving open connections this long so the
        # application can finish in-flight work (SHUTDOWN_GRACE is 25s).
        - --max-sigterm-delay=25s
        - my-gcp-project:europe-west1:audio-jobs-prod
      startupProbe:
        httpGet: {path: /startup, port: 9801}
        periodSeconds: 1
        failureThreshold: 60
      livenessProbe:
        httpGet: {path: /liveness, port: 9801}
        periodSeconds: 10
        failureThreshold: 3
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {memory: 128Mi}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
