# Filestore on the cluster's own VPC. The built-in standard-rwx class creates
# the instance on the "default" network, which the private cluster cannot
# reach: the volume provisions but every mount times out. Found on the first
# deploy to GKE. Private services access is the same path Cloud SQL and
# Memorystore use.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: filestore-private
provisioner: filestore.csi.storage.gke.io
parameters:
  tier: standard
  network: audio-jobs-prod
  connect-mode: PRIVATE_SERVICE_ACCESS
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
