# Single-node local cluster (Colima k3s, or kind in CI): Postgres and Redis run
# in-cluster, requests are scaled down to fit a laptop VM, and the queue
# timeouts are shortened so the failure drills finish in minutes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - data-namespace.yaml
  - postgres.yaml
  - redis.yaml
  - data-networkpolicies.yaml
  - loadtest.yaml
  - app-egress.yaml
secretGenerator:
  # Generated by scripts/gen-local-secrets.sh, never committed.
  - name: audio-jobs-db
    namespace: audio-jobs
    envs: [secrets/app.env]
  - name: audio-jobs-exporter-db
    namespace: audio-jobs
    envs: [secrets/exporter.env]
  - name: postgres
    namespace: audio-jobs-data
    envs: [secrets/postgres.env]
configMapGenerator:
  - name: postgres-init
    namespace: audio-jobs-data
    files: [postgres-init.sh]
patches:
  - target: {kind: ConfigMap, name: audio-jobs}
    patch: |-
      - {op: replace, path: /data/REDIS_ADDR, value: "redis.audio-jobs-data.svc.cluster.local:6379"}
      - {op: replace, path: /data/VISIBILITY_TIMEOUT, value: 15s}
      - {op: replace, path: /data/SWEEP_EVERY, value: 10s}
      - {op: replace, path: /data/SWEEP_IDLE, value: 30s}
  - target: {kind: PersistentVolumeClaim, name: blobs}
    patch: |-
      - {op: replace, path: /spec/accessModes, value: [ReadWriteOnce]}
      - {op: replace, path: /spec/resources/requests/storage, value: 2Gi}
  # Requests follow measured usage on this VM (about 60m CPU per worker pod
  # at 100 jobs/s), so the HPAs react at laptop-scale load. The API limit
  # leaves room for page cache from blob writes, which counts against it.
  - target: {kind: Deployment, name: api}
    patch: |-
      - {op: replace, path: /spec/progressDeadlineSeconds, value: 60}
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: "1", memory: 512Mi}}
  - target: {kind: Deployment, name: worker}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: "1", memory: 256Mi}}
  - target: {kind: HorizontalPodAutoscaler, name: api}
    patch: |-
      - {op: replace, path: /spec/minReplicas, value: 2}
      - {op: replace, path: /spec/maxReplicas, value: 4}
      - {op: replace, path: /spec/behavior/scaleDown/stabilizationWindowSeconds, value: 60}
  - target: {kind: HorizontalPodAutoscaler, name: worker}
    patch: |-
      - {op: replace, path: /spec/maxReplicas, value: 8}
      - {op: replace, path: /spec/behavior/scaleDown/stabilizationWindowSeconds, value: 60}
