# Local stand-in for Memorystore (same major version, 7.2). Persistence is off
# on purpose: Redis only carries the queue and a result cache, Postgres is the
# source of truth, and the workers' sweeper re-enqueues unfinished jobs if the
# queue is lost (drills/04-redis-restart.sh measures this). noeviction keeps
# Redis from silently dropping queue entries under memory pressure.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: audio-jobs-data
  labels: {app: redis}
spec:
  selector: {app: redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: audio-jobs-data
  labels: {app: redis}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # redis user in the alpine image
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.2.11-alpine
          args:
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 200mb
            - --maxmemory-policy
            - noeviction
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
