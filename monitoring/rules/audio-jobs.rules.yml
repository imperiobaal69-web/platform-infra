# Recording and alerting rules for audio-jobs. This plain Prometheus rule file
# is the source of truth: promtool checks and unit-tests it
# (monitoring/tests/), and scripts/render-rules.sh wraps it into the
# PrometheusRule object that the operator loads.
#
# SLOs, over a rolling 30 days (docs/slos.md):
#   availability  99.5% of synthetic /readyz probes through the API Service succeed
#   job success   99.9% of jobs that finish end "succeeded", not "dead"
#   latency       95% of jobs finish end to end within 5.12 s
#   queue age     no accepted job stays unfinished for more than 120 s
#
# Burn-rate alerts follow the multiwindow, multi-burn-rate pattern from the
# Google SRE workbook: page at 14.4x (2% of a 30-day budget in 1h) and 6x
# (5% in 6h), ticket at 1x over 3 days.
groups:
  - name: audio-jobs-sli
    interval: 30s
    rules:
      # Availability: fraction of failed probes.
      - record: sli:probe_error:ratio_rate5m
        expr: 1 - avg_over_time(probe_success{job="audio-jobs-api-probe"}[5m])
      - record: sli:probe_error:ratio_rate30m
        expr: 1 - avg_over_time(probe_success{job="audio-jobs-api-probe"}[30m])
      - record: sli:probe_error:ratio_rate1h
        expr: 1 - avg_over_time(probe_success{job="audio-jobs-api-probe"}[1h])
      - record: sli:probe_error:ratio_rate6h
        expr: 1 - avg_over_time(probe_success{job="audio-jobs-api-probe"}[6h])
      - record: sli:probe_error:ratio_rate3d
        expr: 1 - avg_over_time(probe_success{job="audio-jobs-api-probe"}[3d])

      # Job success: fraction of finished jobs that ended dead.
      - record: sli:job_error:ratio_rate5m
        expr: sum(rate(aj_jobs_finished_total{status="dead"}[5m])) / sum(rate(aj_jobs_finished_total[5m]))
      - record: sli:job_error:ratio_rate30m
        expr: sum(rate(aj_jobs_finished_total{status="dead"}[30m])) / sum(rate(aj_jobs_finished_total[30m]))
      - record: sli:job_error:ratio_rate1h
        expr: sum(rate(aj_jobs_finished_total{status="dead"}[1h])) / sum(rate(aj_jobs_finished_total[1h]))
      - record: sli:job_error:ratio_rate6h
        expr: sum(rate(aj_jobs_finished_total{status="dead"}[6h])) / sum(rate(aj_jobs_finished_total[6h]))
      - record: sli:job_error:ratio_rate3d
        expr: sum(rate(aj_jobs_finished_total{status="dead"}[3d])) / sum(rate(aj_jobs_finished_total[3d]))

      # Latency.
      - record: sli:job_e2e_seconds:p95_rate10m
        expr: histogram_quantile(0.95, sum by (le) (rate(aj_job_end_to_end_seconds_bucket[10m])))
      - record: sli:job_e2e_within_slo:ratio_rate10m
        expr: |
          sum(rate(aj_job_end_to_end_seconds_bucket{le="5.12"}[10m]))
            / sum(rate(aj_job_end_to_end_seconds_count[10m]))

      # Queue age (from postgres-exporter).
      - record: sli:queue_oldest_unfinished_age_seconds:max
        expr: max(aj_queue_oldest_unfinished_age_seconds)

  - name: audio-jobs-slo-alerts
    rules:
      - alert: AudioJobsAvailabilityBudgetBurn
        expr: |
          (
            sli:probe_error:ratio_rate1h > (14.4 * 0.005)
            and sli:probe_error:ratio_rate5m > (14.4 * 0.005)
          )
          or
          (
            sli:probe_error:ratio_rate6h > (6 * 0.005)
            and sli:probe_error:ratio_rate30m > (6 * 0.005)
          )
        labels:
          severity: page
          slo: availability
        annotations:
          summary: API availability is burning its 30-day error budget too fast
          description: "{{ $value | humanizePercentage }} of availability probes are failing (budget 0.5%)."
          runbook_url: https://github.com/imperiobaal69-web/platform-infra/blob/main/docs/runbooks/error-budget-burn.md

      - alert: AudioJobsAvailabilityBudgetBurnSlow
        expr: |
          sli:probe_error:ratio_rate3d > 0.005
          and sli:probe_error:ratio_rate6h > 0.005
        labels:
          severity: ticket
          slo: availability
        annotations:
          summary: API availability will exhaust its error budget before the 30-day window ends
          runbook_url: https://github.com/imperiobaal69-web/platform-infra/blob/main/docs/runbooks/error-budget-burn.md

      - alert: AudioJobsJobSuccessBudgetBurn
        expr: |
          (
            sli:job_error:ratio_rate1h > (14.4 * 0.001)
            and sli:job_error:ratio_rate5m > (14.4 * 0.001)
          )
          or
          (
            sli:job_error:ratio_rate6h > (6 * 0.001)
            and sli:job_error:ratio_rate30m > (6 * 0.001)
          )
        labels:
          severity: page
          slo: job-success
        annotations:
          summary: Jobs are dying fast enough to burn the job-success error budget
          description: "{{ $value | humanizePercentage }} of finished jobs ended dead (budget 0.1%)."
          runbook_url: https://github.com/imperiobaal69-web/platform-infra/blob/main/docs/runbooks/job-failures.md

      - alert: AudioJobsJobSuccessBudgetBurnSlow
        expr: |
          sli:job_error:ratio_rate3d > 0.001
          and sli:job_error:ratio_rate6h > 0.001
        labels:
          severity: ticket
          slo: job-success
        annotations:
          summary: Job success will exhaust its error budget before the 30-day window ends
          runbook_url: https://github.com/imperiobaal69-web/platform-infra/blob/main/docs/runbooks/job-failures.md

      - alert: AudioJobsLatencyP95High
        expr: sli:job_e2e_seconds:p95_rate10m > 5.12
        for: 10m
        labels:
          severity: page
          slo: latency
        annotations:
          summary: p95 end-to-end job latency is above 5.12 s
          description: "p95 over the last 10 minutes is {{ $value | humanizeDuration }}."
          runbook_url: https://github.com/imperiobaal69-web/platform-infra/blob/main/docs/runbooks/job-latency.md

      - alert: AudioJobsQueueAgeHigh
        expr: sli:queue_oldest_unfinished_age_seconds:max > 120
        for: 2m
        labels:
          severity: page
          slo: queue-age
        annotations:
          summary: An accepted job has been unfinished for more than 2 minutes
          description: "Oldest unfinished job is {{ $value | humanizeDuration }} old."
          runbook_url: https://github.com/imperiobaal69-web/platform-infra/blob/main/docs/runbooks/queue-age.md

  - name: audio-jobs-symptoms
    rules:
      # Fast symptom alert: the burn-rate alert needs minutes of failure
      # before it fires, a full outage should page within about a minute.
      - alert: AudioJobsAPIDown
        expr: avg_over_time(probe_success{job="audio-jobs-api-probe"}[1m]) == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: Every availability probe through the API Service failed for 2 minutes
          runbook_url: https://github.com/imperiobaal69-web/platform-infra/blob/main/docs/runbooks/api-unavailable.md

      - alert: AudioJobsDeadLetters
        expr: increase(aj_jobs_finished_total{status="dead"}[15m]) > 0
        labels:
          severity: ticket
        annotations:
          summary: Jobs exhausted their retries and were dead-lettered
          runbook_url: https://github.com/imperiobaal69-web/platform-infra/blob/main/docs/runbooks/job-failures.md

  - name: audio-jobs-infrastructure
    rules:
      - alert: AudioJobsPostgresDown
        expr: max(pg_up) == 0 or absent(pg_up)
        for: 1m
        labels:
          severity: page
        annotations:
          summary: postgres-exporter cannot reach Postgres (or is not reporting)
          runbook_url: https://github.com/imperiobaal69-web/platform-infra/blob/main/docs/runbooks/postgres-down.md

      # Local overlay only: on GKE Memorystore health comes from Cloud
      # Monitoring. API readiness also fails while Redis is down, which
      # AudioJobsAPIDown covers in every environment.
      - alert: AudioJobsRedisDown
        expr: kube_statefulset_status_replicas_ready{namespace="audio-jobs-data", statefulset="redis"} < 1
        for: 1m
        labels:
          severity: page
        annotations:
          summary: The Redis pod is not ready
          runbook_url: https://github.com/imperiobaal69-web/platform-infra/blob/main/docs/runbooks/redis-down.md

      - alert: AudioJobsWorkersUnavailable
        expr: kube_deployment_status_replicas_available{namespace="audio-jobs", deployment="worker"} < 1
        for: 2m
        labels:
          severity: page
        annotations:
          summary: No worker pod is available; jobs are being accepted but not processed
          runbook_url: https://github.com/imperiobaal69-web/platform-infra/blob/main/docs/runbooks/workers-unavailable.md

      - alert: AudioJobsPodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total{namespace="audio-jobs"}[10m]) > 3
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.pod }} restarted more than 3 times in 10 minutes"
          runbook_url: https://github.com/imperiobaal69-web/platform-infra/blob/main/docs/runbooks/workers-unavailable.md

      - alert: AudioJobsRolloutStuck
        expr: kube_deployment_status_condition{namespace="audio-jobs", condition="Progressing", status="false"} == 1
        labels:
          severity: ticket
        annotations:
          summary: "Rollout of {{ $labels.deployment }} exceeded its progress deadline"
          runbook_url: https://github.com/imperiobaal69-web/platform-infra/blob/main/docs/runbooks/bad-deploy.md

      - alert: AudioJobsHPAAtMaximum
        expr: |
          kube_horizontalpodautoscaler_status_current_replicas{namespace="audio-jobs"}
            >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="audio-jobs"}
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.horizontalpodautoscaler }} has been at its replica ceiling for 15 minutes"
          runbook_url: https://github.com/imperiobaal69-web/platform-infra/blob/main/docs/runbooks/capacity.md
